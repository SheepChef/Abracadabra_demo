# TEST-ONLY: save as .github/workflows/frontend-ci-staging-test.yml on branch ci-staging.
# No production job or production credentials are referenced.
# Deploy stays skipped until repository variable ENABLE_STAGING_DEPLOY is set to 'true'.
# Create a GitHub environment 'staging' restricted to ci-staging,
# with environment secrets CF_STAGING_API_TOKEN and CF_STAGING_ACCOUNT_ID.
# Create a separate Cloudflare Pages project named abracadabra-ci-staging.
name: Frontend CI (Staging only)

on:
  push:
    branches:
      - ci-staging

permissions:
  contents: read

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-24.04
    outputs:
      short_sha: ${{ steps.short_sha.outputs.value }}
    steps:
      - name: Resolve 7-character Git commit SHA
        id: short_sha
        run: echo "value=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  web:
    needs: metadata
    name: Build Web / PWA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify web output
        run: |
          test -s docs/index.html
          test -s docs/manifest.webmanifest
          test -s docs/sw.js
      - name: Upload web build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: Web-${{ needs.metadata.outputs.short_sha }}
          path: docs/
          if-no-files-found: error
          retention-days: 30

  variants:
    needs: metadata
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Single File
            command: build:singlefile
            directory: dist-singlefile
            filename: SingleFile
          - label: Chrome Extension
            command: build:chrome
            directory: dist-chrome
            filename: ChromeExt
          - label: Firefox Extension
            command: build:firefox
            directory: dist-firefox
            filename: FirefoxExt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - name: Verify output
        env:
          OUTPUT_DIR: ${{ matrix.directory }}
          BUILD_COMMAND: ${{ matrix.command }}
        run: |
          if [ "$BUILD_COMMAND" = 'build:singlefile' ]; then
            test -s "$OUTPUT_DIR/index.html"
          else
            test -s "$OUTPUT_DIR/manifest.json"
          fi
      - name: Collect standalone HTML (no inner ZIP)
        if: matrix.command == 'build:singlefile'
        run: |
          mkdir -p packages
          cp dist-singlefile/index.html "packages/Abracadabra-SingleFile-${GITHUB_SHA::7}.html"
      - name: Package browser extension
        if: matrix.command != 'build:singlefile'
        env:
          OUTPUT_DIR: ${{ matrix.directory }}
          OUTPUT_NAME: ${{ matrix.filename }}
        run: |
          mkdir -p packages
          ( cd "$OUTPUT_DIR" && zip -qr "${GITHUB_WORKSPACE}/packages/Abracadabra-${OUTPUT_NAME}-${GITHUB_SHA::7}.zip" . )
      - name: Upload build file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}-${{ needs.metadata.outputs.short_sha }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30

  android:
    needs: metadata
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK requirements
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JS dependencies
        run: |
          npm ci
          npm ci --prefix Abracadabra-cordova
      - name: Generate Cordova icon absent from git
        run: |
          python3 -m pip install --quiet Pillow
          mkdir -p Abracadabra-cordova/res
          python3 - <<'PY'
          from PIL import Image
          Image.open('favicon.webp').convert('RGBA').save('Abracadabra-cordova/res/favicon.png')
          PY
      - name: Build Android web assets
        env:
          BUILD_TARGET: android
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vite build
      - name: Assign Android versionCode (do not modify versionName)
        id: android_version
        env:
          VERSION_CODE_BASE: '100000'
        run: |
          set -euo pipefail
          export CI_VERSION_CODE=$(( VERSION_CODE_BASE + GITHUB_RUN_NUMBER ))
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          import re
          import xml.etree.ElementTree as ET

          path = Path('Abracadabra-cordova/config.xml')
          source = path.read_text(encoding='utf-8')
          before = ET.fromstring(source)
          code = os.environ['CI_VERSION_CODE']
          if not (1 <= int(code) <= 2100000000):
              raise SystemExit(f'Invalid Android versionCode: {code}')
          updated, count = re.subn(
              r'(android-versionCode=")\d+(")',
              lambda m: m.group(1) + code + m.group(2),
              source,
          )
          if count != 1:
              raise SystemExit(f'Expected one android-versionCode attribute, got {count}')
          after = ET.fromstring(updated)
          if before.attrib['version'] != after.attrib['version']:
              raise SystemExit('Unexpected versionName modification')
          path.write_text(updated, encoding='utf-8')
          print(f"Android versionName={after.attrib['version']}, versionCode={after.attrib['android-versionCode']}")
          PYCODE
          echo "code=$CI_VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Restore Android platform
        working-directory: Abracadabra-cordova
        run: npx --yes cordova@13.0.0 platform add android@15.0.0
      - name: Build unsigned-for-release, debug-signed APK
        working-directory: Abracadabra-cordova
        run: npx --yes cordova@13.0.0 build android --debug -- --packageType=apk
      - name: Verify versionCode and collect Android APK
        env:
          CI_VERSION_CODE: ${{ steps.android_version.outputs.code }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find Abracadabra-cordova/platforms/android/app/build/outputs/apk -type f -name '*-debug.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected 1 Debug APK, found ${#apks[@]}" >&2
            exit 1
          fi
          apk_info=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" | grep '^package:')
          echo "$apk_info"
          [[ "$apk_info" == *"versionCode='$CI_VERSION_CODE'"* ]] || {
            echo "Built APK versionCode does not match $CI_VERSION_CODE" >&2
            exit 1
          }
          mkdir -p packages
          cp "${apks[0]}" "packages/Abracadabra-Android-vc${CI_VERSION_CODE}-${GITHUB_SHA::7}.apk"
      # Upload raw APK as the artifact content; GitHub Actions downloads still arrive in an outer ZIP.
      - name: Upload Android APK (no inner ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-vc${{ steps.android_version.outputs.code }}-${{ needs.metadata.outputs.short_sha }}
          path: packages/Abracadabra-Android-*.apk
          if-no-files-found: error
          retention-days: 30

  staging_deploy:
 
    name: Deploy to separate staging Pages project (opt-in)
    needs: [metadata, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci-staging' && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: abracadabra-pages-staging
      cancel-in-progress: true
    steps:
      - name: Download the exact Web artifact into an empty directory
        uses: actions/download-artifact@v4
        with:
          name: Web-${{ needs.metadata.outputs.short_sha }}
          path: ${{ runner.temp }}/abracadabra-staging-assets
      - name: Verify staged assets
        working-directory: ${{ runner.temp }}/abracadabra-staging-assets
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
      
      - name: Verify staging Pages API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          HTTP_CODE=$(curl -sS \
            -o "$RUNNER_TEMP/pages-check.json" \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/abracadabra-ci-staging")

          jq -c '{
            success,
            project: .result.name,
            errors: [.errors[]? | {code, message}]
          }' "$RUNNER_TEMP/pages-check.json"

          test "$HTTP_CODE" = "200"

          jq -e \
            '.success == true and .result.name == "abracadabra-ci-staging"' \
            "$RUNNER_TEMP/pages-check.json" > /dev/null

      - name: Deploy to explicitly named STAGING project ONLY
        working-directory: ${{ runner.temp }}/abracadabra-staging-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 pages deploy . \
            --project-name=abracadabra-ci-staging \
            --branch=ci-staging \
            --commit-hash="$GITHUB_SHA"
