<!DOCTYPE html>
<!--为了解决Chrome插件性能回归，将整个popup裹在一个iframe中--->
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      width: 760px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="index.html" title="Abracadabra"></iframe>
</body>
</html>
